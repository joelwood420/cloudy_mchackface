app = "cloudy-mchackface"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

# Runs once per deploy, before new machines start: migrate, then load seed/*.yaml.
[deploy]
  release_command = "sh -c 'alembic upgrade head && python -m app.seed'"

[env]
  COOKIE_SECURE = "true"
  TRUST_FLY_CLIENT_IP = "true"
  APP_URL = "https://cloudy-mchackface.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
