# One-off setup items, defined once and referenced by key from submodules in the module files.
# uplearn_url points to the how-to post on UPLearn (most include a video walkthrough).
# Never put training keys, passwords or Teams/Calendly/Zoom links here.
prerequisites:
  - key: programme-start
    title: "Complete the Programme Overview start-up steps"
    note: "Read 'Start Here' and the 'Things to know' posts in course 00 before week 1."
    uplearn_url: https://yoobee.uplearn.education/course/view.php?id=704
  - key: aws-academy-cloud-foundations
    title: "Accept the AWS Academy Cloud Foundations invite"
    note: "The invite is sent to your Yoobee email."
    external_url: https://awsacademy.instructure.com/
    uplearn_url: https://yoobee.uplearn.education/mod/forum/discuss.php?d=49392
  - key: aws-academy-cloud-architecting
    title: "Accept the AWS Academy Cloud Architecting invite"
    note: "The invite is sent to your Yoobee email."
